name: PowerShell module validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import module manifest
        shell: pwsh
        run: Test-ModuleManifest ./PSAIOpenAIDecisions.psd1
      - name: Select Pester 5
        shell: pwsh
        run: |
          $pester = Get-Module -Name Pester -ListAvailable |
            Where-Object { $_.Version.Major -eq 5 -and $_.Version -ge [version]'5.4.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester) {
            Install-Module -Name Pester -MinimumVersion 5.4.0 -MaximumVersion 5.999.999 `
              -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
            $pester = Get-Module -Name Pester -ListAvailable |
              Where-Object { $_.Version.Major -eq 5 -and $_.Version -ge [version]'5.4.0' } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          }
          if (-not $pester) { throw 'Pester 5.4.0 or newer is not available.' }
          Import-Module Pester -RequiredVersion $pester.Version -Force
      - name: Run module tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests'
          $configuration.Run.Exit = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = Join-Path $env:RUNNER_TEMP 'PSAIOpenAIDecisions-testResults.xml'
          $configuration.Output.CIFormat = 'GitHubActions'
          Invoke-Pester -Configuration $configuration
